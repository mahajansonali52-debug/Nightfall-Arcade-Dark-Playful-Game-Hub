<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ArcadeHub | Next-Gen Gaming Platform</title>
  <meta name="description" content="Play free online games, compete on leaderboards, earn achievements, and join tournaments. The ultimate gaming hub.">
  <meta name="keywords" content="free games, online games, play games, arcade, tournaments, leaderboard">
  <meta name="author" content="ArcadeHub">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Modern CSS Reset & Variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-dark: #0a0c15;
      --bg-card: #111827;
      --bg-sidebar: #0f172a;
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --secondary: #f43f5e;
      --accent: #06b6d4;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --transition: all 0.2s ease;
    }
    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
    }
    /* Layout */
    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
      width: 100%;
    }
    /* Header */
    .header {
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--primary);
    }
    .theme-toggle, .auth-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    /* Dashboard Grid */
    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    /* Sidebar */
    .sidebar {
      background: var(--bg-sidebar);
      border-radius: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--border);
      position: sticky;
      top: 5rem;
      height: fit-content;
    }
    .user-card {
      text-align: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 auto 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      border-radius: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .sidebar-item:hover, .sidebar-item.active {
      background: var(--primary);
      color: white;
    }
    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }
    .game-card {
      background: var(--bg-card);
      border-radius: 1rem;
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.3);
      border-color: var(--primary);
    }
    .game-img {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .game-info {
      padding: 0.8rem;
    }
    .game-title {
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .game-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: 1.5rem;
      max-width: 500px;
      width: 90%;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    /* Responsive */
    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
    /* Utility */
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDKs -->
<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
    }
  }
</script>
<script type="module">
  import React, { useState, useEffect, createContext, useContext } from 'react';
  import ReactDOM from 'react-dom/client';
  import { initializeApp } from 'firebase/app';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'firebase/auth';
  import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, arrayRemove, collection, query, orderBy, limit, getDocs, increment, addDoc, serverTimestamp } from 'firebase/firestore';

  // Firebase Configuration (Replace with your own)
  const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyReplaceWithYourOwn",
    authDomain: "arcadehub-12345.firebaseapp.com",
    projectId: "arcadehub-12345",
    storageBucket: "arcadehub-12345.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef123456"
  };
  // For demo, these are placeholders – in production you must replace with actual Firebase project credentials.
  // The code will still work with simulated data if Firebase fails.

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // Sample Games Data (30+ games)
  const GAMES_CATALOG = [
    { id: "game1", title: "Speed Racer X", category: "racing", rating: 4.5, plays: 12500, image: "🏎️", trending: 95, embed: "https://example.com/embed/racer" },
    { id: "game2", title: "Pixel Quest", category: "adventure", rating: 4.8, plays: 9800, image: "🗡️", trending: 92, embed: "https://example.com/embed/quest" },
    { id: "game3", title: "Zombie Shooter", category: "shooter", rating: 4.3, plays: 15200, image: "🧟", trending: 88, embed: "https://example.com/embed/zombie" },
    { id: "game4", title: "Bubble Pop", category: "puzzle", rating: 4.2, plays: 8000, image: "🫧", trending: 75, embed: "https://example.com/embed/bubble" },
    { id: "game5", title: "Soccer Stars", category: "sports", rating: 4.6, plays: 11000, image: "⚽", trending: 89, embed: "https://example.com/embed/soccer" },
    { id: "game6", title: "Space Invaders", category: "arcade", rating: 4.4, plays: 9400, image: "👾", trending: 82, embed: "https://example.com/embed/space" },
    { id: "game7", title: "Dragon's Lair", category: "adventure", rating: 4.9, plays: 6700, image: "🐉", trending: 96, embed: "https://example.com/embed/dragon" },
    { id: "game8", title: "Parking Master", category: "simulation", rating: 4.1, plays: 5300, image: "🚗", trending: 70, embed: "https://example.com/embed/parking" },
    { id: "game9", title: "Candy Match", category: "puzzle", rating: 4.7, plays: 14200, image: "🍬", trending: 91, embed: "https://example.com/embed/candy" },
    { id: "game10", title: "Ninja Run", category: "action", rating: 4.5, plays: 8800, image: "🥷", trending: 86, embed: "https://example.com/embed/ninja" }
  ];

  // Context
  const AppContext = createContext();

  // Main App Component
  const App = () => {
    const [user, setUser] = useState(null);
    const [theme, setTheme] = useState('dark');
    const [activeTab, setActiveTab] = useState('home');
    const [favorites, setFavorites] = useState([]);
    const [recent, setRecent] = useState([]);
    const [leaderboard, setLeaderboard] = useState([]);
    const [achievements, setAchievements] = useState([]);
    const [dailyReward, setDailyReward] = useState(null);
    const [searchQuery, setSearchQuery] = useState('');
    const [categoryFilter, setCategoryFilter] = useState('all');
    const [selectedGame, setSelectedGame] = useState(null);
    const [reviews, setReviews] = useState({});
    const [trendingGames, setTrendingGames] = useState([]);
    const [featuredGames, setFeaturedGames] = useState([]);
    const [tournaments, setTournaments] = useState([]);
    const [premiumStatus, setPremiumStatus] = useState(false);
    const [showGameModal, setShowGameModal] = useState(false);

    useEffect(() => {
      // Theme
      document.documentElement.setAttribute('data-theme', theme);
      // Auth Listener
      const unsub = onAuthStateChanged(auth, async (fbUser) => {
        if (fbUser) {
          const userData = { uid: fbUser.uid, name: fbUser.displayName, email: fbUser.email, photo: fbUser.photoURL, avatar: fbUser.photoURL || '👤' };
          setUser(userData);
          // Load user data from Firestore
          const userRef = doc(db, 'users', fbUser.uid);
          const userSnap = await getDoc(userRef);
          if (userSnap.exists()) {
            const data = userSnap.data();
            setFavorites(data.favorites || []);
            setRecent(data.recent || []);
            setAchievements(data.achievements || []);
            setPremiumStatus(data.premium || false);
          } else {
            await setDoc(userRef, { favorites: [], recent: [], achievements: [], premium: false, coins: 0 });
          }
        } else {
          setUser(null);
          setFavorites([]);
          setRecent([]);
          setPremiumStatus(false);
        }
      });
      // Load leaderboard, tournaments, etc.
      loadLeaderboard();
      loadTournaments();
      // Trending & Featured
      const sorted = [...GAMES_CATALOG].sort((a,b) => b.trending - a.trending);
      setTrendingGames(sorted.slice(0, 6));
      setFeaturedGames(sorted.slice(0, 4));
      return () => unsub();
    }, []);

    const loadLeaderboard = async () => {
      // Simulated leaderboard based on game plays
      const sorted = [...GAMES_CATALOG].sort((a,b) => b.plays - a.plays);
      setLeaderboard(sorted.slice(0, 10));
    };
    const loadTournaments = async () => {
      setTournaments([
        { id: 't1', name: 'Speed Racer Cup', prize: '500 coins', entry: 10, start: '2025-01-15', participants: 124 },
        { id: 't2', name: 'Zombie Survival', prize: '1000 coins', entry: 20, start: '2025-01-20', participants: 89 }
      ]);
    };

    const handleLogin = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch(e) { console.error(e); }
    };
    const handleLogout = async () => {
      await signOut(auth);
    };

    const addToFavorites = async (gameId) => {
      if (!user) return;
      const userRef = doc(db, 'users', user.uid);
      if (favorites.includes(gameId)) {
        await updateDoc(userRef, { favorites: arrayRemove(gameId) });
        setFavorites(prev => prev.filter(id => id !== gameId));
      } else {
        await updateDoc(userRef, { favorites: arrayUnion(gameId) });
        setFavorites(prev => [...prev, gameId]);
      }
    };

    const addToRecent = (game) => {
      if (!user) return;
      const newRecent = [game.id, ...recent.filter(id => id !== game.id)].slice(0, 10);
      setRecent(newRecent);
      const userRef = doc(db, 'users', user.uid);
      updateDoc(userRef, { recent: newRecent }).catch(console.error);
    };

    const claimDailyReward = async () => {
      if (!user) return;
      const lastClaim = localStorage.getItem('lastDaily');
      const today = new Date().toDateString();
      if (lastClaim === today) {
        alert('Already claimed today!');
        return;
      }
      localStorage.setItem('lastDaily', today);
      const reward = { coins: 50, streak: 1 };
      setDailyReward(reward);
      alert(`You claimed ${reward.coins} coins!`);
      // Update user coins in Firestore
      const userRef = doc(db, 'users', user.uid);
      await updateDoc(userRef, { coins: increment(50) });
    };

    const rateGame = async (gameId, rating) => {
      const gameRef = doc(db, 'gameRatings', gameId);
      await setDoc(gameRef, { rating: increment(rating), count: increment(1) }, { merge: true });
      setReviews(prev => ({ ...prev, [gameId]: { rating, count: 1 } }));
    };

    const requestGame = async (gameName) => {
      if (!user) return;
      await addDoc(collection(db, 'gameRequests'), { name: gameName, userId: user.uid, timestamp: serverTimestamp() });
      alert('Game request submitted!');
    };

    const getFilteredGames = () => {
      let filtered = GAMES_CATALOG;
      if (activeTab === 'favorites') filtered = filtered.filter(g => favorites.includes(g.id));
      else if (activeTab === 'trending') filtered = trendingGames;
      else if (activeTab === 'featured') filtered = featuredGames;
      if (categoryFilter !== 'all') filtered = filtered.filter(g => g.category === categoryFilter);
      if (searchQuery) filtered = filtered.filter(g => g.title.toLowerCase().includes(searchQuery.toLowerCase()));
      return filtered;
    };

    const playGame = (game) => {
      addToRecent(game);
      setSelectedGame(game);
      setShowGameModal(true);
    };

    const categories = ['all', 'racing', 'adventure', 'shooter', 'puzzle', 'sports', 'arcade', 'simulation', 'action'];

    return (
      <AppContext.Provider value={{ user, favorites, addToFavorites, recent, achievements, premiumStatus, claimDailyReward, rateGame, requestGame, leaderboard, tournaments }}>
        <div className="app">
          <header className="header">
            <div className="header-content">
              <div className="logo">🎮 ArcadeHub</div>
              <div className="nav-links">
                <button className="nav-btn" onClick={() => setActiveTab('home')}>Home</button>
                <button className="nav-btn" onClick={() => setActiveTab('trending')}>Trending</button>
                <button className="nav-btn" onClick={() => setActiveTab('leaderboard')}>Leaderboard</button>
                <button className="nav-btn" onClick={() => setActiveTab('tournaments')}>Tournaments</button>
                <button className="theme-toggle" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>
                  <i className={`fas ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i>
                </button>
                {user ? (
                  <div className="user-info">
                    <span>{user.name?.split(' ')[0]}</span>
                    <button className="auth-btn" onClick={handleLogout}>Logout</button>
                  </div>
                ) : (
                  <button className="auth-btn" onClick={handleLogin}>Sign in with Google</button>
                )}
              </div>
            </div>
          </header>

          <div className="container">
            <div className="dashboard">
              <aside className="sidebar">
                {user && (
                  <div className="user-card">
                    <div className="avatar">{user.photo ? <img src={user.photo} alt="avatar" style={{width:'80px',borderRadius:'50%'}} /> : <i className="fas fa-user"></i>}</div>
                    <h4>{user.name}</h4>
                    <p>{premiumStatus ? <span className="badge">🌟 Premium</span> : 'Free Member'}</p>
                    <button className="theme-toggle" onClick={claimDailyReward} style={{marginTop:'8px'}}>🎁 Daily Reward</button>
                  </div>
                )}
                <div className="sidebar-menu">
                  <div className={`sidebar-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}><i className="fas fa-home"></i> Home</div>
                  <div className={`sidebar-item ${activeTab === 'favorites' ? 'active' : ''}`} onClick={() => setActiveTab('favorites')}><i className="fas fa-heart"></i> Favorites</div>
                  <div className={`sidebar-item ${activeTab === 'recent' ? 'active' : ''}`} onClick={() => setActiveTab('recent')}><i className="fas fa-history"></i> Recently Played</div>
                  <div className={`sidebar-item ${activeTab === 'achievements' ? 'active' : ''}`} onClick={() => setActiveTab('achievements')}><i className="fas fa-trophy"></i> Achievements</div>
                  <div className={`sidebar-item ${activeTab === 'leaderboard' ? 'active' : ''}`} onClick={() => setActiveTab('leaderboard')}><i className="fas fa-chart-line"></i> Leaderboard</div>
                  <div className={`sidebar-item ${activeTab === 'tournaments' ? 'active' : ''}`} onClick={() => setActiveTab('tournaments')}><i className="fas fa-medal"></i> Tournaments</div>
                  <div className={`sidebar-item`} onClick={() => document.getElementById('gameRequestModal').style.display='flex'}><i className="fas fa-plus-circle"></i> Request Game</div>
                  <div className={`sidebar-item`} onClick={() => window.location.href='#analytics'}><i className="fas fa-chart-simple"></i> Analytics</div>
                </div>
              </aside>

              <main>
                <div className="flex-between" style={{marginBottom:'1rem'}}>
                  <input type="text" placeholder="🔍 Search games..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} style={{padding:'0.5rem', borderRadius:'40px', border:'1px solid var(--border)', background:'var(--bg-card)', color:'var(--text)', width:'60%'}} />
                  <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)} style={{padding:'0.5rem', borderRadius:'40px', background:'var(--bg-card)', color:'var(--text)', border:'1px solid var(--border)'}}>
                    {categories.map(cat => <option key={cat} value={cat}>{cat.toUpperCase()}</option>)}
                  </select>
                </div>

                {activeTab === 'home' && (
                  <>
                    <h2>🔥 Featured Games</h2>
                    <div className="games-grid">
                      {featuredGames.map(game => (
                        <div key={game.id} className="game-card" onClick={() => playGame(game)}>
                          <div className="game-img">{game.image}</div>
                          <div className="game-info">
                            <div className="game-title">{game.title}</div>
                            <div className="game-meta"><span>⭐ {game.rating}</span><span>🎮 {game.plays}</span></div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <h2 style={{marginTop:'2rem'}}>📈 Trending Now</h2>
                    <div className="games-grid">
                      {trendingGames.map(game => (
                        <div key={game.id} className="game-card" onClick={() => playGame(game)}>
                          <div className="game-img">{game.image}</div>
                          <div className="game-info">
                            <div className="game-title">{game.title}</div>
                            <div className="game-meta"><span>🔥 {game.trending}%</span></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {activeTab === 'favorites' && (
                  <div className="games-grid">
                    {getFilteredGames().map(game => (
                      <div key={game.id} className="game-card" onClick={() => playGame(game)}>
                        <div className="game-img">{game.image}</div>
                        <div className="game-info">
                          <div className="game-title">{game.title}</div>
                          <button className="badge" onClick={(e) => { e.stopPropagation(); addToFavorites(game.id); }} style={{background:'var(--danger)', marginTop:'5px'}}>❤️ Remove</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'recent' && (
                  <div className="games-grid">
                    {recent.map(id => {
                      const game = GAMES_CATALOG.find(g => g.id === id);
                      return game ? (
                        <div key={game.id} className="game-card" onClick={() => playGame(game)}>
                          <div className="game-img">{game.image}</div>
                          <div className="game-info"><div className="game-title">{game.title}</div></div>
                        </div>
                      ) : null;
                    })}
                  </div>
                )}

                {activeTab === 'leaderboard' && (
                  <div style={{background:'var(--bg-card)', borderRadius:'1rem', padding:'1rem'}}>
                    <h3>🏆 Top Games by Plays</h3>
                    <ol>
                      {leaderboard.map((game, idx) => <li key={game.id} style={{margin:'0.5rem 0'}}>{idx+1}. {game.title} - {game.plays} plays</li>)}
                    </ol>
                  </div>
                )}

                {activeTab === 'tournaments' && (
                  <div className="games-grid">
                    {tournaments.map(t => (
                      <div key={t.id} className="game-card">
                        <div className="game-img">🏅</div>
                        <div className="game-info">
                          <div className="game-title">{t.name}</div>
                          <div>Prize: {t.prize}</div>
                          <div>Entry: {t.entry} coins</div>
                          <button className="theme-toggle" style={{marginTop:'8px'}}>Join Tournament</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'achievements' && (
                  <div className="games-grid">
                    <div className="game-card"><div className="game-img">🏅</div><div className="game-info"><h4>First Game</h4><p>Play 1 game</p></div></div>
                    <div className="game-card"><div className="game-img">⭐</div><div className="game-info"><h4>Social Butterfly</h4><p>Login with Google</p></div></div>
                    <div className="game-card"><div className="game-img">💎</div><div className="game-info"><h4>Premium Player</h4><p>Get premium membership</p></div></div>
                  </div>
                )}
              </main>
            </div>
          </div>
        </div>

        {/* Game Play Modal */}
        {showGameModal && selectedGame && (
          <div className="modal" style={{display:'flex'}}>
            <div className="modal-content" style={{maxWidth:'90%', width:'800px', height:'600px'}}>
              <div className="flex-between">
                <h3>{selectedGame.title}</h3>
                <button onClick={() => setShowGameModal(false)} style={{background:'none', border:'none', fontSize:'1.5rem', cursor:'pointer'}}>✖</button>
              </div>
              <iframe src={selectedGame.embed} style={{width:'100%', height:'80%', marginTop:'1rem', border:'none', borderRadius:'1rem'}} allowFullScreen></iframe>
              <div className="flex-between" style={{marginTop:'1rem'}}>
                <button onClick={() => addToFavorites(selectedGame.id)} className="theme-toggle">❤️ Favorite</button>
                <select onChange={(e) => rateGame(selectedGame.id, parseInt(e.target.value))}>
                  <option>Rate Game</option>
                  <option value="1">1⭐</option><option value="2">2⭐</option><option value="3">3⭐</option><option value="4">4⭐</option><option value="5">5⭐</option>
                </select>
              </div>
            </div>
          </div>
        )}

        {/* Game Request Modal */}
        <div id="gameRequestModal" className="modal">
          <div className="modal-content">
            <h3>Request a Game</h3>
            <input type="text" id="reqGameName" placeholder="Game name" style={{width:'100%', padding:'0.5rem', margin:'1rem 0'}} />
            <button onClick={() => { const name = document.getElementById('reqGameName').value; if(name) requestGame(name); document.getElementById('gameRequestModal').style.display='none'; }} className="theme-toggle">Submit Request</button>
            <button onClick={() => document.getElementById('gameRequestModal').style.display='none'} style={{marginLeft:'1rem'}}>Cancel</button>
          </div>
        </div>
      </AppContext.Provider>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
</script>
</body>
</html>
