    .game-icon { width: 80px; height: 80px; object-fit: cover; border-radius: 16px; margin: 0 auto 0.5rem; display: block; }

    /* Game Player Overlay with Fullscreen */
    .game-player-overlay {
      position: fixed;

    .game-iframe-container { flex: 1; width: 100%; background: #000; border-radius: 20px; overflow: hidden; }
    .game-iframe-container iframe { width: 100%; height: 100%; border: none; }
    
    /* Modal for Suggestions */
    .modal {
      display: none;
      position: fixed;

      width: 100%;
      height: 100%;

    }
    .modal-content {
      background: #1e293b;

      border-radius: 28px;

    }
    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;

      border: 1px solid #334155;
      border-radius: 16px;
      color: white;
      font-family: inherit;
    }
    .modal-content button {
      background: #22c55e;
      border: none;
      padding: 0.6rem;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    
    .footer { text-align: center; margin-top: 2rem; color: #94a3b8; }
    
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; position: static; }
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>

<script src="https://www.highperformanceformat.com/52352aafdb8e582a93ea264d64273a99/invoke.js"></script>

<script>
  // ========= CONFIG =========
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/1d3dQIastMEGZzeWtnnVrQ6e86jsexVV1RAHcydP-lOU/export?format=csv';
  
  // Favorites System (localStorage)
  let favorites = JSON.parse(localStorage.getItem('nightfall_favorites') || '[]');
  
  function saveFavorites() {
    localStorage.setItem('nightfall_favorites', JSON.stringify(favorites));
    updateFavoritesList();
    updateStats();
  }
  
  function toggleFavorite(gameId, gameName) {
    const index = favorites.indexOf(gameId);
    if (index === -1) {
      favorites.push(gameId);
    } else {
      favorites.splice(index, 1);
    }
    saveFavorites();
    renderGrid(); // re-render to update star icons
  }
  
  function isFavorite(gameId) { return favorites.includes(gameId); }
  
  let allGames = [], filteredGames = [], currentSearchTerm = "", currentCategory = "all";
  const grid = document.getElementById('gamesGridContainer');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearchBtn');
  const countSpan = document.getElementById('countValue');
  const gamePlayer = document.getElementById('gamePlayer');
  const gamePlayerTitle = document.getElementById('gamePlayerTitle');
  const gameIframeContainer = document.getElementById('gameIframeContainer');
  const closeGameBtn = document.getElementById('closeGameBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
  
  // Fullscreen function
  function toggleFullscreen() {
    const container = document.getElementById('gameIframeContainer');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => console.log(err));
    } else {
      document.exitFullscreen();
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  
  function playGameInside(game) {
    gamePlayerTitle.innerText = game.name;
    gameIframeContainer.innerHTML = '';
    
    if (game.embed && game.embed.trim() !== '') {
      let safeEmbed = game.embed.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      const embedDiv = document.createElement('div');
      embedDiv.style.width = '100%';
      embedDiv.style.height = '100%';
      embedDiv.innerHTML = safeEmbed;
      gameIframeContainer.appendChild(embedDiv);
    } else if (game.link && game.link !== "#") {
      const iframe = document.createElement('iframe');
      iframe.src = game.link;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.setAttribute('allowfullscreen', 'true');
      gameIframeContainer.appendChild(iframe);
    } else {
      gameIframeContainer.innerHTML = '<div style="padding:3rem; text-align:center;">No game content available</div>';
    }
    gamePlayer.style.display = 'flex';
  }
  
  function closeGamePlayer() { gamePlayer.style.display = 'none'; gameIframeContainer.innerHTML = ''; }
  
  function updateFavoritesList() {
    const favList = document.getElementById('favoritesList');
    const favGames = allGames.filter(g => isFavorite(g.id || g.name));
    if (favGames.length === 0) {
      favList.innerHTML = '<div style="color:#64748b; text-align:center;">⭐ Click star on any game</div>';
      return;
    }
    favList.innerHTML = favGames.map(g => `
      <div class="favorite-item">
        <span style="overflow:hidden; text-overflow:ellipsis;">${escapeHtml(g.name)}</span>
        <button onclick="toggleFavorite('${escapeHtml(g.id || g.name)}', '${escapeHtml(g.name)}')"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');
  }
  
  function updateStats() {
    const statsDiv = document.getElementById('statsDisplay');
    const totalGames = allGames.length;
    const favCount = favorites.length;
    statsDiv.innerHTML = `
      <div><i class="fas fa-database"></i> Total: ${totalGames}</div>
      <div><i class="fas fa-star"></i> Favorites: ${favCount}</div>
      <div><i class="fas fa-chart-simple"></i> ${new Date().toLocaleDateString()}</div>
    `;
  }
  
  function renderGrid() {
    let displayGames = [...allGames];
    if (currentCategory === 'favorites') {
      displayGames = displayGames.filter(g => isFavorite(g.id || g.name));
    }
    if (currentSearchTerm.trim()) {
      displayGames = displayGames.filter(g => g.name.toLowerCase().includes(currentSearchTerm.toLowerCase()));
    }
    filteredGames = displayGames;
    countSpan.innerText = filteredGames.length;
    
    if (filteredGames.length === 0) {
      grid.innerHTML = `<div class="empty-state">No games found</div>`;
      return;
    }
    
    let html = '';
    for (let game of filteredGames) {
      const gameId = game.id || game.name;
      const favorited = isFavorite(gameId);
      const iconHtml = game.icon ? `<img class="game-icon" src="${escapeHtml(game.icon)}" onerror="this.src='https://placehold.co/80x80?text=🎮'">` : `<div class="game-icon" style="background:#4c1d95; display:flex; align-items:center; justify-content:center;"><i class="fas fa-gamepad" style="font-size:2rem;"></i></div>`;
      
      html += `
        <div class="game-card" data-game-name="${escapeHtml(game.name)}" data-game-link="${escapeHtml(game.link)}" data-game-embed="${escapeHtml(game.embed || '')}">
          <div class="favorite-star ${favorited ? 'favorited' : ''}" data-game-id="${escapeHtml(gameId)}" data-game-name="${escapeHtml(game.name)}">
            <i class="fas fa-star"></i>
          </div>
          ${iconHtml}
          <div class="game-name">${escapeHtml(game.name)}</div>
          <div class="play-badge"><i class="fas fa-play-circle"></i> Play</div>
        </div>
      `;
    }
    grid.innerHTML = html;
    
    document.querySelectorAll('.game-card').forEach(card => {
      const gameName = card.getAttribute('data-game-name');
      const gameLink = card.getAttribute('data-game-link');
      const gameEmbed = card.getAttribute('data-game-embed');
      card.addEventListener('click', (e) => {
        if (e.target.closest('.favorite-star')) return;
        playGameInside({ name: gameName, link: gameLink, embed: gameEmbed });
      });
    });
    
    document.querySelectorAll('.favorite-star').forEach(star => {
      star.addEventListener('click', (e) => {
        e.stopPropagation();
        const gameId = star.getAttribute('data-game-id');
        const gameName = star.getAttribute('data-game-name');
        toggleFavorite(gameId, gameName);
      });
    });
  }
  
  function applyFilter() { renderGrid(); }
  
  // Category buttons
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-category');
      renderGrid();
    });
  });
  
  // Suggestion Modal
  const modal = document.getElementById('suggestModal');
  document.getElementById('openSuggestModal').onclick = () => modal.style.display = 'flex';
  document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
  document.getElementById('submitSuggestion').onclick = () => {
    const name = document.getElementById('suggestName').value;
    const link = document.getElementById('suggestLink').value;
    const desc = document.getElementById('suggestDesc').value;
    const email = document.getElementById('suggestEmail').value;
    if (!name) { alert('Please enter game name'); return; }
    const subject = `Game Suggestion: ${name}`;
    const body = `Game: ${name}%0ALink: ${link}%0ADescription: ${desc}%0ASuggested by: ${email || 'anonymous'}`;
    window.location.href = `mailto:youremail@example.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    alert('Suggestion sent! (Opens your email app)');
    modal.style.display = 'none';
    document.getElementById('suggestName').value = '';
    document.getElementById('suggestLink').value = '';
    document.getElementById('suggestDesc').value = '';
    document.getElementById('suggestEmail').value = '';
  };
  
  function parseCSV(csvText) {
    const rows = []; let row = [], buffer = '', inQuotes = false;
    for (let i = 0; i < csvText.length; i++) {
      let ch = csvText[i];
      if (ch === '"') { if (inQuotes && csvText[i+1] === '"') { buffer += '"'; i++; } else { inQuotes = !inQuotes; } }
      else if (ch === ',' && !inQuotes) { row.push(buffer.trim()); buffer = ''; }
      else if (ch === '\n' && !inQuotes) { row.push(buffer.trim()); if (row.length) rows.push(row); row = []; buffer = ''; }
      else { buffer += ch; }
    }
    row.push(buffer.trim()); if (row.length && row[0] !== '') rows.push(row);
    if (!rows.length) return [];
    let headers = rows[0].map(h => h.replace(/^"|"$/g, '').toLowerCase());
    return rows.slice(1).map(row => {
      let obj = {};
      headers.forEach((h, i) => obj[h] = (row[i] || '').replace(/^"|"$/g, '').replace(/""/g, '"'));
      return obj;
    });
  }
  
  async function loadGames() {
    try {
      const resp = await fetch(CSV_URL);
      if (!resp.ok) throw new Error();
      const csv = await resp.text();
      let gamesData = parseCSV(csv);
      allGames = gamesData.map((row, idx) => ({
        id: `game_${idx}`,
        name: row.name || row.title || "Mystery Game",
        icon: row.icon || row.image || "",
        link: row.link || row.url || "#",
        embed: row.embed || row.embedded || ""
      }));
      if (!allGames.length) allGames = [{ id: 'demo', name: 'Demo Game', icon: '', link: '#', embed: '<div style="padding:40px; text-align:center;">✨ Add games to your CSV!</div>' }];
      updateFavoritesList();
      updateStats();
      renderGrid();
    } catch(e) { grid.innerHTML = '<div class="empty-state">⚠️ Could not load games. Check CSV URL.</div>'; }
  }
  
  closeGameBtn.addEventListener('click', closeGamePlayer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && gamePlayer.style.display === 'flex') closeGamePlayer(); });
  searchInput.addEventListener('input', (e) => { currentSearchTerm = e.target.value; renderGrid(); });
  clearBtn.addEventListener('click', () => { searchInput.value = ""; currentSearchTerm = ""; renderGrid(); });
  
  loadGames();
</script>
</body>
