<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ArcadeHub | Next-Gen Gaming Platform</title>
  <meta name="description" content="Play free online games, compete on leaderboards, earn achievements, and join tournaments. The ultimate gaming hub.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-dark: #0a0c15;
      --bg-card: #111827;
      --bg-sidebar: #0f172a;
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --secondary: #f43f5e;
      --accent: #06b6d4;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --transition: all 0.2s ease;
    }
    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
    }
    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
      width: 100%;
    }
    .header {
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-btn, .theme-toggle, .auth-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      font-family: inherit;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--primary);
    }
    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .sidebar {
      background: var(--bg-sidebar);
      border-radius: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--border);
      position: sticky;
      top: 5rem;
      height: fit-content;
    }
    .user-card {
      text-align: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 auto 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      border-radius: 1rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .sidebar-item:hover, .sidebar-item.active {
      background: var(--primary);
      color: white;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }
    .game-card {
      background: var(--bg-card);
      border-radius: 1rem;
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.3);
      border-color: var(--primary);
    }
    .game-img {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .game-info {
      padding: 0.8rem;
    }
    .game-title {
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .game-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: 1.5rem;
      max-width: 500px;
      width: 90%;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      font-size: 0.7rem;
    }
    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }
    }
    input, select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 40px;
    }
    button {
      transition: var(--transition);
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  // ==================== GAME DATABASE ====================
  const GAMES = [
    { id: "game1", title: "Speed Racer X", category: "racing", rating: 4.5, plays: 12500, image: "🏎️", trending: 95, embed: "https://www.crazygames.com/embed/speed-racer-x" },
    { id: "game2", title: "Pixel Quest", category: "adventure", rating: 4.8, plays: 9800, image: "🗡️", trending: 92, embed: "https://www.crazygames.com/embed/pixel-quest" },
    { id: "game3", title: "Zombie Shooter", category: "shooter", rating: 4.3, plays: 15200, image: "🧟", trending: 88, embed: "https://www.crazygames.com/embed/zombie-shooter" },
    { id: "game4", title: "Bubble Pop", category: "puzzle", rating: 4.2, plays: 8000, image: "🫧", trending: 75, embed: "https://www.crazygames.com/embed/bubble-pop" },
    { id: "game5", title: "Soccer Stars", category: "sports", rating: 4.6, plays: 11000, image: "⚽", trending: 89, embed: "https://www.crazygames.com/embed/soccer-stars" },
    { id: "game6", title: "Space Invaders", category: "arcade", rating: 4.4, plays: 9400, image: "👾", trending: 82, embed: "https://www.crazygames.com/embed/space-invaders" },
    { id: "game7", title: "Dragon's Lair", category: "adventure", rating: 4.9, plays: 6700, image: "🐉", trending: 96, embed: "https://www.crazygames.com/embed/dragons-lair" },
    { id: "game8", title: "Parking Master", category: "simulation", rating: 4.1, plays: 5300, image: "🚗", trending: 70, embed: "https://www.crazygames.com/embed/parking-master" },
    { id: "game9", title: "Candy Match", category: "puzzle", rating: 4.7, plays: 14200, image: "🍬", trending: 91, embed: "https://www.crazygames.com/embed/candy-match" },
    { id: "game10", title: "Ninja Run", category: "action", rating: 4.5, plays: 8800, image: "🥷", trending: 86, embed: "https://www.crazygames.com/embed/ninja-run" },
    { id: "game11", title: "Moto X3M", category: "racing", rating: 4.8, plays: 21000, image: "🏍️", trending: 98, embed: "https://www.crazygames.com/embed/moto-x3m" },
    { id: "game12", title: "Shell Shockers", category: "shooter", rating: 4.6, plays: 18000, image: "🥚", trending: 94, embed: "https://www.crazygames.com/embed/shell-shockers" }
  ];

  // Local storage keys
  const STORAGE_KEYS = {
    USER: 'arcadehub_user',
    FAVORITES: 'arcadehub_favorites',
    RECENT: 'arcadehub_recent',
    ACHIEVEMENTS: 'arcadehub_achievements',
    PREMIUM: 'arcadehub_premium',
    LAST_DAILY: 'arcadehub_last_daily',
    RATINGS: 'arcadehub_ratings'
  };

  // Helper functions
  function getStorage(key, defaultValue) {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : defaultValue;
  }
  function setStorage(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  // State
  let currentUser = getStorage(STORAGE_KEYS.USER, null);
  let favorites = getStorage(STORAGE_KEYS.FAVORITES, []);
  let recentGames = getStorage(STORAGE_KEYS.RECENT, []);
  let achievements = getStorage(STORAGE_KEYS.ACHIEVEMENTS, []);
  let premium = getStorage(STORAGE_KEYS.PREMIUM, false);
  let ratings = getStorage(STORAGE_KEYS.RATINGS, {});
  let theme = getStorage('arcadehub_theme', 'dark');
  let activeTab = 'home';
  let searchQuery = '';
  let categoryFilter = 'all';
  let selectedGame = null;
  let leaderboard = [];
  let tournaments = [
    { id: 't1', name: 'Speed Racer Cup', prize: '500 coins', entry: 10, start: '2025-01-15', participants: 124 },
    { id: 't2', name: 'Zombie Survival', prize: '1000 coins', entry: 20, start: '2025-01-20', participants: 89 }
  ];

  // DOM Elements
  let root;
  let gameModal, requestModal;

  // Helper to compute leaderboard
  function updateLeaderboard() {
    leaderboard = [...GAMES].sort((a,b) => b.plays - a.plays).slice(0, 10);
  }
  updateLeaderboard();

  // Save user data
  function saveUserData() {
    setStorage(STORAGE_KEYS.USER, currentUser);
    setStorage(STORAGE_KEYS.FAVORITES, favorites);
    setStorage(STORAGE_KEYS.RECENT, recentGames);
    setStorage(STORAGE_KEYS.ACHIEVEMENTS, achievements);
    setStorage(STORAGE_KEYS.PREMIUM, premium);
    setStorage(STORAGE_KEYS.RATINGS, ratings);
  }

  // Login/Logout simulation (Google-like popup)
  function login() {
    const name = prompt("Enter your name:", "Player");
    if (name) {
      currentUser = { uid: Date.now().toString(), name: name, email: name + "@player.com", avatar: "👤" };
      saveUserData();
      render();
    }
  }
  function logout() {
    currentUser = null;
    favorites = [];
    recentGames = [];
    achievements = [];
    premium = false;
    saveUserData();
    render();
  }

  // Add to favorites
  function addToFavorites(gameId) {
    if (!currentUser) { alert("Please login first"); return; }
    if (favorites.includes(gameId)) {
      favorites = favorites.filter(id => id !== gameId);
    } else {
      favorites.push(gameId);
      // Unlock achievement
      if (favorites.length === 3 && !achievements.includes("collector")) {
        achievements.push("collector");
        alert("🎉 Achievement Unlocked: Collector (3 favorites)!");
      }
    }
    saveUserData();
    render();
  }

  // Add to recent
  function addToRecent(gameId) {
    if (!currentUser) return;
    recentGames = [gameId, ...recentGames.filter(id => id !== gameId)].slice(0, 10);
    saveUserData();
    // First game achievement
    if (recentGames.length === 1 && !achievements.includes("first_game")) {
      achievements.push("first_game");
      alert("🎉 Achievement Unlocked: First Game!");
    }
    render();
  }

  // Claim daily reward
  function claimDailyReward() {
    if (!currentUser) { alert("Login first"); return; }
    const lastClaim = localStorage.getItem(STORAGE_KEYS.LAST_DAILY);
    const today = new Date().toDateString();
    if (lastClaim === today) {
      alert("Already claimed today! Come back tomorrow.");
      return;
    }
    localStorage.setItem(STORAGE_KEYS.LAST_DAILY, today);
    alert("🎁 You claimed 50 coins! (demo)");
    render();
  }

  // Rate game
  function rateGame(gameId, ratingVal) {
    if (!currentUser) { alert("Login to rate"); return; }
    if (!ratings[gameId]) ratings[gameId] = { total: 0, count: 0 };
    ratings[gameId].total += ratingVal;
    ratings[gameId].count += 1;
    saveUserData();
    render();
  }

  // Request game
  function requestGame(gameName) {
    if (!currentUser) { alert("Login first"); return; }
    alert(`Game "${gameName}" requested! (demo)`);
    // In real app, store in localStorage or send to admin
  }

  // Get filtered games
  function getFilteredGames() {
    let filtered = [...GAMES];
    if (activeTab === 'favorites') {
      filtered = filtered.filter(g => favorites.includes(g.id));
    } else if (activeTab === 'trending') {
      filtered = filtered.filter(g => g.trending > 85).sort((a,b) => b.trending - a.trending);
    } else if (activeTab === 'featured') {
      filtered = filtered.filter(g => g.trending > 90).slice(0, 6);
    }
    if (categoryFilter !== 'all') {
      filtered = filtered.filter(g => g.category === categoryFilter);
    }
    if (searchQuery) {
      filtered = filtered.filter(g => g.title.toLowerCase().includes(searchQuery.toLowerCase()));
    }
    return filtered;
  }

  // Play game
  function playGame(game) {
    addToRecent(game.id);
    selectedGame = game;
    gameModal.style.display = 'flex';
  }

  // Toggle theme
  function toggleTheme() {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    setStorage('arcadehub_theme', theme);
    render(); // re-render to update button icon
  }

  // Render UI
  function render() {
    document.documentElement.setAttribute('data-theme', theme);
    const filtered = getFilteredGames();
    const trendingGames = [...GAMES].sort((a,b) => b.trending - a.trending).slice(0, 6);
    const featuredGames = [...GAMES].filter(g => g.trending > 90).slice(0, 4);
    const categories = ['all', ...new Set(GAMES.map(g => g.category))];

    const html = `
      <div class="app">
        <header class="header">
          <div class="header-content">
            <div class="logo">🎮 ArcadeHub</div>
            <div class="nav-links">
              <button class="nav-btn ${activeTab === 'home' ? 'active' : ''}" data-tab="home">Home</button>
              <button class="nav-btn ${activeTab === 'trending' ? 'active' : ''}" data-tab="trending">Trending</button>
              <button class="nav-btn ${activeTab === 'leaderboard' ? 'active' : ''}" data-tab="leaderboard">Leaderboard</button>
              <button class="nav-btn ${activeTab === 'tournaments' ? 'active' : ''}" data-tab="tournaments">Tournaments</button>
              <button class="theme-toggle" id="themeToggle"><i class="fas ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i></button>
              ${currentUser ? `
                <span style="color: var(--text);">${currentUser.name}</span>
                <button class="auth-btn" id="logoutBtn">Logout</button>
              ` : `
                <button class="auth-btn" id="loginBtn">Sign in with Google</button>
              `}
            </div>
          </div>
        </header>

        <div class="container">
          <div class="dashboard">
            <aside class="sidebar">
              ${currentUser ? `
                <div class="user-card">
                  <div class="avatar"><i class="fas fa-user"></i></div>
                  <h4>${currentUser.name}</h4>
                  <p>${premium ? '<span class="badge">🌟 Premium</span>' : 'Free Member'}</p>
                  <button class="theme-toggle" id="dailyRewardBtn" style="margin-top:8px;">🎁 Daily Reward</button>
                </div>
              ` : `
                <div class="user-card">
                  <div class="avatar"><i class="fas fa-user"></i></div>
                  <p>Login to save favorites & earn rewards</p>
                </div>
              `}
              <div class="sidebar-menu">
                <div class="sidebar-item ${activeTab === 'home' ? 'active' : ''}" data-tab="home"><i class="fas fa-home"></i> Home</div>
                <div class="sidebar-item ${activeTab === 'favorites' ? 'active' : ''}" data-tab="favorites"><i class="fas fa-heart"></i> Favorites</div>
                <div class="sidebar-item ${activeTab === 'recent' ? 'active' : ''}" data-tab="recent"><i class="fas fa-history"></i> Recently Played</div>
                <div class="sidebar-item ${activeTab === 'achievements' ? 'active' : ''}" data-tab="achievements"><i class="fas fa-trophy"></i> Achievements</div>
                <div class="sidebar-item ${activeTab === 'leaderboard' ? 'active' : ''}" data-tab="leaderboard"><i class="fas fa-chart-line"></i> Leaderboard</div>
                <div class="sidebar-item ${activeTab === 'tournaments' ? 'active' : ''}" data-tab="tournaments"><i class="fas fa-medal"></i> Tournaments</div>
                <div class="sidebar-item" id="requestGameBtn"><i class="fas fa-plus-circle"></i> Request Game</div>
              </div>
            </aside>

            <main>
              <div class="flex-between" style="margin-bottom:1rem;">
                <input type="text" id="searchInput" placeholder="🔍 Search games..." value="${searchQuery}" style="width:60%;" />
                <select id="categorySelect">
                  ${categories.map(cat => `<option value="${cat}" ${categoryFilter === cat ? 'selected' : ''}>${cat.toUpperCase()}</option>`).join('')}
                </select>
              </div>

              ${activeTab === 'home' ? `
                <h2>🔥 Featured Games</h2>
                <div class="games-grid">
                  ${featuredGames.map(game => `
                    <div class="game-card" data-game-id="${game.id}">
                      <div class="game-img">${game.image}</div>
                      <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-meta"><span>⭐ ${(ratings[game.id] ? (ratings[game.id].total / ratings[game.id].count).toFixed(1) : game.rating)}</span><span>🎮 ${game.plays}</span></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
                <h2 style="margin-top:2rem;">📈 Trending Now</h2>
                <div class="games-grid">
                  ${trendingGames.map(game => `
                    <div class="game-card" data-game-id="${game.id}">
                      <div class="game-img">${game.image}</div>
                      <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-meta"><span>🔥 ${game.trending}%</span></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : activeTab === 'favorites' ? `
                <div class="games-grid">
                  ${filtered.map(game => `
                    <div class="game-card" data-game-id="${game.id}">
                      <div class="game-img">${game.image}</div>
                      <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <button class="badge fav-remove" data-game-id="${game.id}" style="background:var(--danger); margin-top:5px;">❤️ Remove</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : activeTab === 'recent' ? `
                <div class="games-grid">
                  ${recentGames.map(id => {
                    const game = GAMES.find(g => g.id === id);
                    return game ? `
                      <div class="game-card" data-game-id="${game.id}">
                        <div class="game-img">${game.image}</div>
                        <div class="game-info">
                          <div class="game-title">${game.title}</div>
                        </div>
                      </div>
                    ` : '';
                  }).join('')}
                </div>
              ` : activeTab === 'achievements' ? `
                <div class="games-grid">
                  <div class="game-card"><div class="game-img">🏅</div><div class="game-info"><h4>First Game</h4><p>Play 1 game</p>${achievements.includes('first_game') ? '✅' : '🔒'}</div></div>
                  <div class="game-card"><div class="game-img">⭐</div><div class="game-info"><h4>Collector</h4><p>3 favorites</p>${achievements.includes('collector') ? '✅' : '🔒'}</div></div>
                  <div class="game-card"><div class="game-img">💎</div><div class="game-info"><h4>Premium Player</h4><p>Get premium membership</p>${premium ? '✅' : '🔒'}</div></div>
                </div>
              ` : activeTab === 'leaderboard' ? `
                <div style="background:var(--bg-card); border-radius:1rem; padding:1rem;">
                  <h3>🏆 Top Games by Plays</h3>
                  <ol>
                    ${leaderboard.map((game, idx) => `<li style="margin:0.5rem 0">${idx+1}. ${game.title} - ${game.plays} plays</li>`).join('')}
                  </ol>
                </div>
              ` : activeTab === 'tournaments' ? `
                <div class="games-grid">
                  ${tournaments.map(t => `
                    <div class="game-card">
                      <div class="game-img">🏅</div>
                      <div class="game-info">
                        <div class="game-title">${t.name}</div>
                        <div>Prize: ${t.prize}</div>
                        <div>Entry: ${t.entry} coins</div>
                        <button class="theme-toggle join-tournament" data-tournament-id="${t.id}" style="margin-top:8px;">Join Tournament</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </main>
          </div>
        </div>
      </div>
    `;
    root.innerHTML = html;

    // Attach event listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        activeTab = btn.getAttribute('data-tab');
        render();
      });
    });
    document.querySelectorAll('.sidebar-item[data-tab]').forEach(item => {
      item.addEventListener('click', () => {
        activeTab = item.getAttribute('data-tab');
        render();
      });
    });
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
    const loginBtn = document.getElementById('loginBtn');
    if (loginBtn) loginBtn.addEventListener('click', login);
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', logout);
    const dailyBtn = document.getElementById('dailyRewardBtn');
    if (dailyBtn) dailyBtn.addEventListener('click', claimDailyReward);
    const requestBtn = document.getElementById('requestGameBtn');
    if (requestBtn) requestBtn.addEventListener('click', () => { requestModal.style.display = 'flex'; });
    const searchInputEl = document.getElementById('searchInput');
    if (searchInputEl) searchInputEl.addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
    const categorySelect = document.getElementById('categorySelect');
    if (categorySelect) categorySelect.addEventListener('change', (e) => { categoryFilter = e.target.value; render(); });
    // Game cards
    document.querySelectorAll('.game-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('fav-remove')) return;
        const gameId = card.getAttribute('data-game-id');
        const game = GAMES.find(g => g.id === gameId);
        if (game) playGame(game);
      });
    });
    document.querySelectorAll('.fav-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const gameId = btn.getAttribute('data-game-id');
        addToFavorites(gameId);
      });
    });
    document.querySelectorAll('.join-tournament').forEach(btn => {
      btn.addEventListener('click', () => alert("Tournament join feature coming soon!"));
    });
  }

  // Initialize modals
  function initModals() {
    // Game modal
    gameModal = document.createElement('div');
    gameModal.className = 'modal';
    gameModal.id = 'gameModal';
    gameModal.innerHTML = `
      <div class="modal-content" style="max-width:90%; width:800px; height:600px;">
        <div class="flex-between">
          <h3 id="gameModalTitle"></h3>
          <button id="closeGameModal" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">✖</button>
        </div>
        <iframe id="gameIframe" style="width:100%; height:80%; margin-top:1rem; border:none; border-radius:1rem;" allowFullScreen></iframe>
        <div class="flex-between" style="margin-top:1rem;">
          <button id="favoriteGameBtn" class="theme-toggle">❤️ Favorite</button>
          <select id="rateGameSelect">
            <option>Rate Game</option>
            <option value="1">1⭐</option><option value="2">2⭐</option><option value="3">3⭐</option><option value="4">4⭐</option><option value="5">5⭐</option>
          </select>
        </div>
      </div>
    `;
    document.body.appendChild(gameModal);
    document.getElementById('closeGameModal')?.addEventListener('click', () => {
      gameModal.style.display = 'none';
      selectedGame = null;
    });
    // Request modal
    requestModal = document.createElement('div');
    requestModal.className = 'modal';
    requestModal.id = 'requestModal';
    requestModal.innerHTML = `
      <div class="modal-content">
        <h3>Request a Game</h3>
        <input type="text" id="reqGameName" placeholder="Game name" style="width:100%; padding:0.5rem; margin:1rem 0;" />
        <button id="submitRequest" class="theme-toggle">Submit Request</button>
        <button id="closeRequestModal" style="margin-left:1rem;">Cancel</button>
      </div>
    `;
    document.body.appendChild(requestModal);
    document.getElementById('submitRequest')?.addEventListener('click', () => {
      const name = document.getElementById('reqGameName').value;
      if (name) requestGame(name);
      requestModal.style.display = 'none';
    });
    document.getElementById('closeRequestModal')?.addEventListener('click', () => {
      requestModal.style.display = 'none';
    });
  }

  function init() {
    root = document.getElementById('app');
    initModals();
    render();
    // Attach global modal close on outside click
    window.onclick = (e) => {
      if (e.target === gameModal) gameModal.style.display = 'none';
      if (e.target === requestModal) requestModal.style.display = 'none';
    };
    // Handle rating
    document.addEventListener('change', (e) => {
      if (e.target.id === 'rateGameSelect' && selectedGame) {
        const rating = parseInt(e.target.value);
        if (!isNaN(rating)) {
          rateGame(selectedGame.id, rating);
          alert(`Rated ${selectedGame.title} ${rating}⭐`);
          render(); // refresh ratings display
        }
      }
    });
    document.addEventListener('click', (e) => {
      if (e.target.id === 'favoriteGameBtn' && selectedGame) {
        addToFavorites(selectedGame.id);
        alert(`${selectedGame.title} ${favorites.includes(selectedGame.id) ? 'added to' : 'removed from'} favorites`);
        render();
      }
    });
    // Update game modal title and iframe when selectedGame changes
    const observer = new MutationObserver(() => {
      const titleEl = document.getElementById('gameModalTitle');
      const iframeEl = document.getElementById('gameIframe');
      if (titleEl && selectedGame) titleEl.innerText = selectedGame.title;
      if (iframeEl && selectedGame) iframeEl.src = selectedGame.embed;
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  init();
</script>
</body>
</html>
